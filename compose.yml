services:
  counter:
    image: tmatsudate/payment-counter:latest
    networks:
      frontend:
        ipv4_address: 172.28.0.1
      backend:
        ipv4_address: 172.28.1.1
    ports:
      - "127.0.0.1:8000:80"
  api:
    image: tmatsudate/payment-api:latest
    networks:
      backend:
        ipv4_address: 172.28.1.2
  admin:
    image: tmatsudate/payment-admin:latest
    networks:
      backend:
        ipv4_address: 172.28.1.3
networks:
  frontend:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.254
  backend:
    ipam:
      driver: default
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.254
