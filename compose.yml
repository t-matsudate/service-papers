services:
  counter:
    image: ubuntu:26.04
    networks:
      frontend:
        ipv4_address: 127.0.0.1
      backend:
        ipv4_address: 127.0.1.1
  api:
    image: ubuntu:26.04
    networks:
      backend:
        ipv4_address: 127.0.1.2
  admin:
    image: ubuntu:26.04
    networks:
      backend:
        ipv4_address: 127.0.1.3
networks:
  frontend:
    ipam:
      driver: default
      config:
        subnet: 127.0.0.0/24
        gateway: 127.0.0.254
  backend:
    ipam:
      driver: default
      config:
        subnet: 127.0.1.0/24
        gateway: 127.0.1.254
