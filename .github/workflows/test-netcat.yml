name: NetCat
on:
  workflow_run:
    workflows: [Service Containers]
    types: [completed]
jobs:
  nc:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Running netcat to service containers
    runs-on: ubuntu-24.04
    steps:
      - id: install-netcat
        name: Installing netcat-traditional
        run: |
          sudo apt update
          sudo apt install -y netcat-traditional
          alias nc=nc.traditional
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
      - id: compose-up
        name: Compose up
        run: docker compose up -d
      - id: netcat-counter
        name: With the counters
        run: nc -z 127.0.0.1 8000-8009
      - id: netcat-api
        name: With the api
        run: |
          ! nc -z 127.0.0.1 8010-8019
      - id: netcat-admin
        name: With the admin
        run: |
          ! nc -z 127.0.0.1 8020-8029
      - id: install-nginx
        name: Installing Nginx
        run: |
          sudo apt install -y nginx
          sudo rm /etc/nginx/sites-available/default
          sudo cp -f ./etc/nginx/proxy/nginx.conf /etc/nginx/nginx.conf
          sudo systemctl restart nginx
      - id: netcat-proxy
        name: With the proxy
        run: nc -z 127.0.0.1 80
      - id: curl-proxy
        name: Dumping Response
        run: curl http://127.0.0.1
      - id: compose-down
        name: Compose down
        if: ${{ always() }}
        run: docker compose down
