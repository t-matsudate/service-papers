name: Testing ICMP request to service containers
on: push
jobs:
  nc:
    name: Compose service containers
    runs-on: ubuntu-24.04
    steps:
      - id: install-netcat
        name: Installing netcat-traditional
        run: |
          apt update
          apt install netcat-traditional
          alias nc=nc.traditional
      - id: checkout
        name: Checking out repository
        uses: actions/checkout@v7
      - id: compose-up
        name: Running compose up
        run: docker compose up
      - id: netcat-counter
        name: Making sure connections with the counter
        run: |
          nc -z 192.168.0.1 8000-8999
          nc -z 192.168.1.1 8000-8999
      - id: netcat-api
        name: Making sure a connection with the api
        run: nc -z 192.168.1.2 8000-8999
      - id: netcat-admin
        name: Making sure a connection with the admin
        run: nc -z 192.168.1.3 8000-8999
      - id: compose-down
        name: Running compose down
        if: ${{ always() }}
        run: docker compose down
